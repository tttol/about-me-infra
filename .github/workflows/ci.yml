name: Infrastructure validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Type-check and run infrastructure regression tests
        run: npm test
      - name: Synthesize with fictional values and no AWS credentials or lookups
        run: npm run synth:offline
      - name: Audit all dependencies (including development tools)
        run: npm audit --audit-level=low
